[package]
name = "crayon_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
crayon_core = { workspace = true }
bevy_camera = { workspace = true }
bevy_drag = { workspace = true }
bevy_mod_reqwest = { workspace = true }
bevy_polyline = { workspace = true }
bevy_debug_grid = { workspace = true }
bevy_mod_outline = { workspace = true }
bevy_wfc = { workspace = true }
block3d_algorithm = { workspace = true }
block3d_core = { workspace = true }
bevy_gaussian_splatting = { workspace = true }
leafwing-input-manager = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
web-sys = { workspace = true }
uuid = { workspace = true }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
crossbeam-channel = { workspace = true }
color-eyre = { workspace = true }
thiserror = { workspace = true }
itertools = { workspace = true }
js-sys = { workspace = true}
wasm-bindgen-futures = { workspace = true }
bevy_asset_loader = { workspace = true }
bevy_crayon_materials = { workspace = true }
gloo-timers = { version ="0.3.0", features = ["futures"] }
# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true } 
strum = { workspace = true}
once_cell = "1.19.0"
bevy_web_asset = "0.9.0"
paste = "1.0"
bevy-inspector-egui = "0.29.1"

# Idiomatic Bevy code often triggers these lints, and the CI workflow treats them as errors.
# In some cases they may still signal poor code quality however, so consider commenting out these lines.
[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments -- which triggers this lint.
too_many_arguments = "allow"
# Queries that access many components may trigger this lint.
type_complexity = "allow"


# Compile with Performance Optimizations:
# https://bevyengine.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

# The default profile is optimized for Wasm builds because
# that's what [Trunk reads](https://github.com/trunk-rs/trunk/issues/605).
# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# Override some settings for native builds.
[profile.release-native]
# Default to release profile values.
inherits = "release"
# Optimize with performance in mind.
opt-level = 3
# Keep debug information in the binary.
strip = "none"


[build-dependencies]

